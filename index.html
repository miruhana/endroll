<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; worker-src blob: https://cdnjs.cloudflare.com; connect-src https://api.anthropic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script src="runtime.js"></script>
<title>エンドロール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
/* Layout: 左に会議一覧、中央に作業エリア、右に根拠パネル。スマホでは一覧と作業を切り替える */
:root{
  --bg:#F5F1EA; --surface:#FAF3EB; --card:#FFFFFF; --ink:#2C3036; --ink2:#666C74; --ink3:#8E949B; --line:#E3E1DB;
  --brand:#4F5478; --brand-ink:#FFFFFF; --brand-tint:#ECE8F4;
  --ok:#5E8873; --ok-tint:#E3EDE7; --warn:#98793F; --warn-tint:#F1EADB; --task:#A5695D; --task-tint:#F3E5E1;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  --font-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1F23; --surface:#22262B; --card:#272B31; --ink:#E6E4DF; --ink2:#A9AEB5; --ink3:#7E848C; --line:#363B42;
  --brand:#A9AEDC; --brand-ink:#1C1F23; --brand-tint:#2D2F44;
  --ok:#86B09A; --ok-tint:#26332C; --warn:#CBAE7A; --warn-tint:#38321F; --task:#CF9487; --task-tint:#3A2C29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1F23; --surface:#22262B; --card:#272B31; --ink:#E6E4DF; --ink2:#A9AEB5; --ink3:#7E848C; --line:#363B42;
  --brand:#A9AEDC; --brand-ink:#1C1F23; --brand-tint:#2D2F44;
  --ok:#86B09A; --ok-tint:#26332C; --warn:#CBAE7A; --warn-tint:#38321F; --task:#CF9487; --task-tint:#3A2C29; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75;font-feature-settings:"palt";-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;min-height:0}
.app.has-ev{grid-template-columns:268px minmax(0,1fr) 340px}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-act{padding:14px 16px 14px}
.mlist{flex:1;overflow:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px}
.mitem{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;min-width:0}
.mitem:hover{background:var(--brand-tint)}
.mitem[aria-current="true"]{background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--line)}
.mitem .t{display:block;font-weight:500;font-size:14px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .s{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.side-foot img{width:26px;height:26px;border-radius:50%}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{padding:16px 28px 0;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;line-height:1.45;font-weight:700;flex:1 1 260px;min-width:0;overflow-wrap:anywhere}
.top .meta{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.back{display:none!important}
.steps{display:flex;gap:6px;padding:12px 28px 0;flex-wrap:wrap}
.step{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.step i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.step.on{color:var(--ink)} .step.on i{background:var(--ok)}
.step+.step::before{content:"";width:16px;height:1px;background:var(--line);display:inline-block;margin-right:2px}
.tabs{display:flex;gap:4px;padding:14px 28px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--ink2);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:700}
.tab .n{font-size:11px;background:var(--brand-tint);color:var(--brand);border-radius:99px;padding:1px 7px;margin-left:6px;font-variant-numeric:tabular-nums}
.body{flex:1;overflow:auto;padding:22px 28px 60px;min-height:0}
.wrap{max-width:860px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h2{margin:0 0 4px;font-size:15px;font-weight:700}
.card h3{margin:0 0 6px;font-size:14px}
.hint{font-size:12.5px;color:var(--ink2);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink2)}
.in,.ta,.sel{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
.ta{min-height:180px;resize:vertical;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.quiet{background:none;border-color:transparent;color:var(--ink2)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.drop small{color:var(--ink2);font-size:12px}
.file{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;min-width:0}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .sz{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;font-size:11.5px;border-radius:6px;padding:1px 8px;line-height:1.7;white-space:nowrap;font-weight:500}
.tag.ok{background:var(--ok-tint);color:var(--ok)} .tag.warn{background:var(--warn-tint);color:var(--warn)}
.tag.task{background:var(--task-tint);color:var(--task)} .tag.brand{background:var(--brand-tint);color:var(--brand)} .tag.mute{background:var(--bg);color:var(--ink2)}
.note{background:var(--warn-tint);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px}
.note b{color:var(--warn)}
.ev{display:inline-flex;font-size:11.5px;color:var(--brand);background:var(--brand-tint);border:0;border-radius:6px;padding:0 7px;margin:0 2px;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.6}
.ev:hover{text-decoration:underline}
.ln{display:grid;grid-template-columns:34px 46px 92px minmax(0,1fr);gap:8px;padding:7px 8px;border-radius:8px;font-size:14px;align-items:start;cursor:pointer}
.ln:hover{background:var(--brand-tint)}
.ln.sel{background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--brand)}
.ln .no,.ln .tm{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.ln .sp2{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln .tx{overflow-wrap:anywhere}
.topic{display:flex;flex-direction:column;gap:10px}
.topic .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.topic h3{font-size:16px;margin:0;flex:1;min-width:0}
.lab{font-size:11.5px;color:var(--ink2);letter-spacing:.06em;margin-bottom:2px}
.topic ul{margin:0;padding-left:1.2em}
[contenteditable]{outline:none;border-radius:6px;transition:background .15s}
[contenteditable]:hover{background:var(--bg)} [contenteditable]:focus{background:var(--bg);box-shadow:0 0 0 2px var(--brand-tint)}
.concl{background:var(--ok-tint);border-radius:10px;padding:10px 14px}
.concl .lab{color:var(--ok)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 10px}
.col h2 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.it.dec{border-left:3px solid var(--ok)} .it.pen{border-left:3px solid var(--warn)} .it.act{border-left:3px solid var(--task)}
.it .tx{font-size:14px;line-height:1.65}
.it .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
.it .in{padding:3px 8px;font-size:12.5px;width:auto;flex:1 1 90px}
.it.done .tx{text-decoration:line-through;color:var(--ink3)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .ev{background:var(--brand-tint)}
.sug{display:flex;gap:8px;flex-wrap:wrap}
.ask{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 0}
.ask .in{border-radius:12px}
.evp{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.evp .hd{padding:16px 18px 10px;display:flex;align-items:center;gap:8px}
.evp .hd b{flex:1;font-size:14px}
.evp .bd{padding:0 18px 24px;overflow:auto;flex:1}
.quote{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:10px}
.quote .who{font-size:12px;color:var(--ink2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.quote.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-tint)}
.empty{text-align:center;padding:48px 20px;color:var(--ink2);display:flex;flex-direction:column;gap:12px;align-items:center}
.pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13.5px;max-height:420px;overflow:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#ECE8F4;border:2px solid var(--line);display:block}
.av.s{width:38px;height:38px;border-width:1.5px;flex:none}
.msgrow{display:flex;gap:10px;align-items:flex-start}
.msgrow>div{min-width:0;max-width:calc(100% - 50px)}
.msgrow .nm{font-size:15px;color:var(--ink2);margin:0 0 2px 2px;letter-spacing:.08em;font-family:var(--font-body);font-weight:700}
.msgrow .msg{max-width:100%}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.roro{grid-column:1/-1;display:grid;grid-template-columns:268px minmax(0,1fr);align-items:center;background:var(--surface);border-bottom:1px solid var(--line);min-height:94px}
.roro .lg{padding:8px 20px;display:flex;align-items:center}
.logo,.heromark{display:block;background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center}
.logo{height:76px;aspect-ratio:390/219;-webkit-mask-position:left center;mask-position:left center}
.roro .who{display:flex;align-items:flex-end;gap:12px;padding:8px 20px 0 8px;min-width:0}
.roro .who img{height:82px;width:auto;display:block;flex:none;cursor:pointer;margin-bottom:-2px;transform-origin:bottom center}
.bubble{position:relative;align-self:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 16px;font-size:14px;line-height:1.65;color:var(--ink);max-width:700px;min-width:0;overflow-wrap:anywhere;margin-bottom:6px}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble .nm{font-size:15px;color:var(--brand);font-weight:700;margin-right:8px;letter-spacing:.08em;font-family:'Zen Kurenaido',var(--font-body)}
@keyframes pop{0%{transform:scale(.94) translateY(4px);opacity:.3}100%{transform:none;opacity:1}}
.pop{animation:pop .3s ease-out}
.hero{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px}
.heromark{width:min(330px,88vw);aspect-ratio:379/365}
.herororo{position:relative;width:min(230px,56vw);margin-top:20px}
.herororo img{display:block;width:100%;height:auto}
.herororo .say{position:absolute;top:-22px;right:-14px;font-family:'Zen Kurenaido',var(--font-body);font-size:21px;color:var(--ink);white-space:nowrap;transform:rotate(-4deg)}
.modal{position:fixed;inset:0;background:rgba(30,28,24,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--card);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:100%;overflow:auto}
.about{display:flex;flex-direction:column;gap:14px}
.about .t2{display:flex;gap:16px;align-items:flex-end}
.about .t2 img{width:116px;height:auto;flex:none}
.about h2{margin:0 0 2px;display:block;font-size:36px;line-height:1.2;color:var(--ink);font-family:var(--font-body);font-weight:700}
.about p{margin:0;font-size:14px;line-height:1.9}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.roname{display:inline-flex;gap:.12em;align-items:center;vertical-align:-.14em}
.rg{display:block;height:1em;aspect-ratio:55/71;background:currentColor;-webkit-mask:var(--rog) center/contain no-repeat;mask:var(--rog) center/contain no-repeat}
@media (prefers-reduced-motion:reduce){.bob,.pop{animation:none}}
@media (max-width:1180px){
  .app.has-ev{grid-template-columns:268px minmax(0,1fr)}
  .evp{position:fixed;left:0;right:0;bottom:0;max-height:60%;z-index:20;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:820px){
  .app,.app.has-ev{grid-template-columns:minmax(0,1fr)}
  .app[data-v="list"] .main{display:none}
  .app[data-v="meeting"] .side{display:none}
  .back{display:inline-flex!important}
  .roro{grid-template-columns:auto minmax(0,1fr);min-height:66px}
  .roro .lg{padding:6px 8px 6px 14px} .logo{height:42px}
  .roro .who{padding:4px 12px 0 4px;gap:8px} .roro .who img{height:56px}
  .bubble{font-size:12.5px;padding:6px 12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .top,.steps,.tabs,.body{padding-left:16px;padding-right:16px}
  .grid2,.cols{grid-template-columns:1fr}
  .ln{grid-template-columns:28px 40px minmax(0,1fr);}
  .ln .sp2{grid-column:3} .ln .tx{grid-column:3}
  .ln .no{grid-row:1/3}
  .ln .tm{grid-row:1/3}
  .msg{max-width:100%}
}

<script>
"use strict";
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LIM = { transcript: 30000, material: 10000, materials: 3 };
const STEPS = ["取り込み","文字起こし","議事録","確認","出力"];
const TABS = [["intake","取り込み"],["tr","文字起こし"],["min","議事録"],["dec","決定・未決・宿題"],["qa","質問"],["out","出力"]];
const AV = '<img class="av" src="' + IMG.face + '" alt="" width="64" height="64">';
document.documentElement.style.setProperty('--rog', 'url(' + IMG.roG + ')');
const RORO = '<span class="roname" role="img" aria-label="ロロ"><i class="rg"></i><i class="rg"></i></span>';
const loaded = {};
const loadScript = url => loaded[url] || (loaded[url] = new Promise((ok, ng) => { const s = document.createElement("script"); s.src = url; s.onload = ok; s.onerror = () => ng(new Error("load")); document.head.append(s); }));
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const fmtDate = s => { if(!s) return ""; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日" : s; };
function setPath(o, path, v){ const k = path.split("."); let c = o; for(let i = 0; i < k.length - 1; i++) c = c[k[i]]; c[k[k.length-1]] = v; }

/* ---------- transcript parsing ---------- */
function parseTr(text){
  const out = []; let n = 0;
  for(const raw of String(text || "").split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue; n++;
    let t = "", rest = line;
    const m = /^[\[\(（]?(\d{1,2}:\d{2}(?::\d{2})?)[\]\)）]?\s*(.*)$/.exec(line);
    if(m){ t = m[1]; rest = m[2]; }
    let sp = "", body = rest;
    const s = /^([^:：\s]{1,20})[:：]\s*(.*)$/.exec(rest);
    if(s){ sp = s[1]; body = s[2]; }
    out.push({ n, t, sp, body });
  }
  return out;
}
const trForAI = m => parseTr(m.transcript).map(l => "#" + l.n + (l.t ? " [" + l.t + "]" : "") + (l.sp ? " " + l.sp + ":" : "") + " " + l.body).join("\n");
const matForAI = m => (m.materials || []).map(x => "【資料: " + x.name + "】\n" + x.text).join("\n\n");

/* ---------- file reading ---------- */
async function readFile(f){
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if(["txt","md","csv","tsv","vtt","srt"].includes(ext)) return await f.text();
  if(ext === "docx"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() }); return r.value;
  }
  if(ext === "xlsx" || ext === "xls"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = window.XLSX.read(await f.arrayBuffer(), { type: "array" });
    return wb.SheetNames.map(n => "■" + n + "\n" + window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n");
  }
  if(ext === "pdf"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise; let s = "";
    for(let i = 1; i <= Math.min(pdf.numPages, 40); i++){ const pg = await pdf.getPage(i); const c = await pg.getTextContent(); s += "［" + i + "ページ］\n" + c.items.map(x => x.str).join(" ") + "\n"; }
    return s;
  }
  throw new Error("type");
}

/* ---------- store: 利用者ごとの専用領域（db）。使えないときはこの画面内だけに保持 ---------- */
const S = { uid: null, col: null, mem: !1, meetings: {}, cur: null, tab: "intake", ev: null, busy: null, sample: null, me: null, chatBusy: !1, ctl: null };
const saveT = {};
function persist(m, now){
  m.updatedAt = Date.now();
  if(S.mem || !S.col) return;
  clearTimeout(saveT[m.id]);
  const go = async () => { try { await S.col.doc(m.id).set(JSON.parse(JSON.stringify(m))); } catch(e){ toast(e && e.code === "quota_exceeded" ? "保存の上限に達しました。古い会議を削除してください" : "保存できませんでした。もう一度お試しください"); } };
  if(now) return go(); saveT[m.id] = setTimeout(go, 600);
}
async function removeMeeting(id){
  delete S.meetings[id];
  if(S.cur === id) S.cur = null;
  if(!S.mem && S.col){ try { await S.col.doc(id).delete(); } catch(e){ toast("削除できませんでした"); } }
  render();
}
function newMeeting(init){
  const id = "mtg_" + Date.now().toString(36);
  const m = Object.assign({ id, title: "", date: today(), place: "", attendees: "", status: "作成中", transcript: "", materials: [], result: null, chat: [], createdAt: Date.now() }, init || {});
  S.meetings[id] = m; S.cur = id; S.tab = "intake"; persist(m, true); return m;
}
const cur = () => S.meetings[S.cur];

              { name: "資料2_路線バス再編案（サンプル）.txt", text: "資料2 路線バス再編案\n案A: 本数を維持し、路線を短縮する。\n案B: 本数を減らし、路線を維持する。\n運行経費: 案Aは案Bより低い見込み。" }]

<script>
"use strict";
/* ---------- render ---------- */
const evBtns = (refs) => (refs || []).filter(n => Number.isInteger(n)).map(n => '<button class="ev" data-act="ev" data-n="' + n + '" aria-label="根拠 ' + n + '行目">#' + n + '</button>').join("");
const statusTag = s => '<span class="tag ' + (s === "承認済み" ? "ok" : s === "確認中" ? "warn" : "mute") + '">' + esc(s) + '</span>';
function stepsOn(m){
  const r = m.result, ok = r && (r.decisions || []).concat(r.pending || [], r.actions || []);
  return [true, !!m.transcript.trim(), !!r, !!(ok && ok.length && ok.every(x => x.ok)), m.status === "承認済み"];
}

function renderSide(){

  $("#sidefoot").innerHTML = '<div style="display:flex;flex-direction:column;gap:8px;width:100%"><div class="row" style="gap:8px;flex-wrap:nowrap"><img alt="" src="' + esc(me ? me.avatarUrl : "") + '"' + (me ? "" : " hidden") + '><span>' + (S.mem ? "この画面を閉じると内容は消えます" : "この端末のブラウザにだけ保存。他の人からは見えません") + '</span></div><div class="row" style="gap:6px"><button class="btn sm" data-act="about">ロロって？</button><button class="btn sm quiet" data-act="tipsw" aria-pressed="' + H.on + '">ロロのひとこと：' + (H.on ? "オン" : "オフ") + '</button></div></div>';
}

function renderMain(){
  roroRender();
  const m = cur(), el = $("#main");
  if(!m){
    el.innerHTML = '<div class="empty" style="margin:auto;max-width:780px"><div class="hero"><span class="heromark" role="img" aria-label="エンドロール 議事録アプリ。会議のあとは、最高のエンドロールを。" style="-webkit-mask-image:url(' + IMG.heroM + ');mask-image:url(' + IMG.heroM + ')"></span><div class="herororo"><img src="' + IMG.roro + '" alt="ロロ"><span class="say">まかせてっ！</span></div></div><p style="margin:0;max-width:34em">会議の文字起こしと配付資料を取り込むと、論点ごとの議事録と、決定事項・未決事項・宿題を作ります。</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="new">新しい会議を作る</button><button class="btn" data-act="sample">サンプル会議で試す</button></div><small class="hint">サンプルは架空の会議です</small></div><button class="btn quiet back" data-act="list" style="position:absolute;top:12px;left:12px">← 会議一覧</button>';
    return;
  }

  const cnt = m.result ? (m.result.decisions.length + m.result.pending.length + m.result.actions.length) : 0;

    '<div class="top"><button class="btn quiet sm back" data-act="list">← 会議一覧</button><h1>' + esc(m.title || "（無題の会議）") + '</h1>' +

    '<div class="tabs" role="tablist">' + TABS.map(([k, v]) => '<button class="tab" role="tab" data-act="tab" data-t="' + k + '" aria-selected="' + (S.tab === k) + '">' + v + (k === "dec" && cnt ? '<span class="n">' + cnt + '</span>' : "") + '</button>').join("") + '</div>' +

    '<div class="concl"><div class="lab">結論</div><div contenteditable="plaintext-only" data-edit="result.topics.' + i + '.conclusion" spellcheck="false">' + esc(t.conclusion || "結論なし") + '</div></div></div>').join("");

<script>

/* ---------- AI: 議事録づくり ---------- */
const errCopy = e => ({ not_granted: "AIの利用が許可されていません。表示された確認で「許可」を選ぶと使えます。", rate_limited: "利用回数の上限に近づいています。しばらくしてからお試しください。", invalid_json: "うまく整理できませんでした。もう一度お試しください。", prompt_too_large: "文字起こしと資料が長すぎます。資料を減らしてお試しください。", sampling_disabled: "このアカウントではAIを利用できません。", session_expired: "ログインの有効期限が切れました。画面を開き直してください。", no_webgpu: "このブラウザでは端末内AIを使えません。最新の Edge / Chrome（PC）でお試しください。", model_load: "AIの準備または実行に失敗しました。「AIの設定」から準備をやり直してください。", cancelled: "" }[e && e.code] ?? "AIとの通信に失敗しました。もう一度お試しください。");

function normalize(d, maxN){
  const arr = v => Array.isArray(v) ? v : [], str = v => (v == null ? "" : String(v)).trim();
  const refs = v => arr(v).map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= maxN);
  return {
    overview: str(d.overview),
    topics: arr(d.topics).map(t => ({ title: str(t.title) || "（無題の論点）", background: str(t.background), opinions: arr(t.opinions).map(str).filter(Boolean), conclusion: str(t.conclusion), refs: refs(t.refs) })),
    decisions: arr(d.decisions).map(x => ({ text: str(x.text), topic: str(x.topic), refs: refs(x.refs), ok: false })).filter(x => x.text),
    pending: arr(d.pending).map(x => ({ text: str(x.text), topic: str(x.topic), refs: refs(x.refs), ok: false })).filter(x => x.text),
    actions: arr(d.actions).map(x => ({ task: str(x.task), owner: str(x.owner) || "未定", due: str(x.due) || "未定", refs: refs(x.refs), ok: false, done: false })).filter(x => x.task)
  };
}
async function gen(){
  const m = cur(), sample = S.sample;
  if(!sample){ toast("この画面ではAIを使えません"); return; }
  const n = parseTr(m.transcript).length;
  const prompt = "あなたは自治体職員の議事録作成を補助するアシスタントです。次の会議の文字起こし（行頭の #番号 は行番号）と会議資料から、議事録の元になる整理結果を作ってください。\n" +
    "守ること:\n- 会議の記録にない内容を補わない。推測しない。\n- 各項目に、根拠となる発言の行番号を refs（数値の配列）で付ける。\n- 日付・金額・数値・固有名詞は原文のとおりに書く。\n- 文体は常体（〜する、〜とした）で簡潔にする。\n- 論点は3〜8個。資料の項目も参考にしてよい。\n- 決定事項は、会議で合意された内容だけ。結論が出ず持ち越した事項は未決事項にする。\n- 宿題は、担当者と期限が発言にあれば入れる。なければ「未定」。\n\n" +
    "出力はJSONだけ。形式:\n{\"overview\":\"会議の概要（2〜3文）\",\"topics\":[{\"title\":\"論点名\",\"background\":\"経過\",\"opinions\":[\"主な意見\"],\"conclusion\":\"結論（なければ空文字）\",\"refs\":[2,3]}],\"decisions\":[{\"text\":\"決定事項\",\"topic\":\"論点名\",\"refs\":[6]}],\"pending\":[{\"text\":\"未決事項\",\"topic\":\"論点名\",\"refs\":[13]}],\"actions\":[{\"task\":\"宿題\",\"owner\":\"担当\",\"due\":\"期限\",\"refs\":[14]}]}\n\n" +
    "会議名: " + m.title + "\n開催日: " + m.date + "\n出席者: " + m.attendees + "\n\n【文字起こし】\n" + trForAI(m) + "\n\n" + matForAI(m);

/* ---------- AI: 会議への質問 ---------- */
async function ask(q){

  const rules = "あなたは議事録アプリ「エンドロール」のキャラクター「ロロ」です。性格: 自信満々でちょっと生意気、負けず嫌い、基本は明るく元気で、たまに調子に乗る。かわいらしいが媚びすぎず、偉そうすぎない憎めない生意気さ。ユーザーのことはちゃんと大切にしている。口ぐせは「ロロにまかせて！」。語尾は「〜だよ」「〜じゃん」「〜でしょ？」など自然な口語。一人称は「ロロ」。ただし内容は正確で簡潔にし、絵文字は使わない。口ぐせや決めゼリフは1回の返答で多くて1つまで。\n場面ごとの例: 聞き取れない・分からない点は「ここだけ教えてくれる？」「適当に書くのは嫌だから、ちゃんと確認させて！」。褒められたら「でしょ？ロロ、すごいでしょ？」のように少し得意げに。感謝されたら「べ、別にこれくらい普通だし！……でも、ありがと。」のように照れる。落ち込んだり焦っている様子には「大丈夫。ロロがついてるよ。」「ひとつずつやればいいじゃん。」と励ます。\n次の【文字起こし】と【資料】だけを根拠に、質問へ日本語で答えてください。\n- 根拠となる発言の行番号を、回答の中に #12 の形で必ず添える。\n- 会議にない内容は推測せず「会議の記録には記載がありません」と伝える（口調はロロのままでよい）。\n- 誰がどう発言したかを問われたら、発言者名を挙げる。\n- 正確さは口調より優先する。\n\n会議名: " + m.title + "\n\n【文字起こし】\n" + trForAI(m) + "\n\n" + matForAI(m) + memo;
  m.chat.push({ role: "user", content: q });

  const a = { role: "assistant", content: "" }; S.chatBusy = true; rerender();

function blocks(m){
  const r = m.result, B = [], p = (s, t) => B.push({ s, t });
  p("h1", "議事録"); p("p", "会議名：" + (m.title || "")); p("p", "開催日：" + fmtDate(m.date)); if(m.place) p("p", "場所：" + m.place); if(m.attendees) p("p", "出席者：" + m.attendees); p("p", "状態：" + m.status);
  p("h2", "会議の概要"); p("p", r.overview);
  r.topics.forEach((t, i) => { p("h2", "論点" + (i + 1) + "　" + t.title); if(t.background){ p("lab", "経過"); p("p", t.background); } if(t.opinions.length){ p("lab", "主な意見"); t.opinions.forEach(o => p("li", o)); } p("lab", "結論"); p("p", t.conclusion || "結論なし"); });
  p("h2", "決定事項"); r.decisions.length ? r.decisions.forEach(x => p("li", x.text)) : p("p", "なし");
  p("h2", "未決事項"); r.pending.length ? r.pending.forEach(x => p("li", x.text)) : p("p", "なし");
  p("h2", "宿題（アクション）"); r.actions.length ? r.actions.forEach(x => p("li", x.task + "（担当：" + x.owner + "／期限：" + x.due + "）")) : p("p", "なし");
  if([...r.decisions, ...r.pending, ...r.actions].some(x => !x.ok)) p("p", "※ 確認前の案を含みます。");
  return B;
}
const toText = m => blocks(m).map(b => ({ h1: b.t, h2: "\n■ " + b.t, lab: "【" + b.t + "】", li: "・" + b.t, p: b.t }[b.s])).join("\n");
const toMd = m => blocks(m).map(b => ({ h1: "# " + b.t, h2: "\n## " + b.t, lab: "**" + b.t + "**", li: "- " + b.t, p: b.t }[b.s])).join("\n");
async function toDocx(m){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  const x = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const para = b => { const sz = { h1: 36, h2: 28, lab: 22, li: 22, p: 22 }[b.s], bold = b.s === "h1" || b.s === "h2" || b.s === "lab";
    const ppr = b.s === "h2" ? '<w:pPr><w:spacing w:before="320" w:after="80"/></w:pPr>' : b.s === "li" ? '<w:pPr><w:ind w:left="360" w:hanging="240"/></w:pPr>' : b.s === "h1" ? '<w:pPr><w:spacing w:after="160"/></w:pPr>' : "";
    return "<w:p>" + ppr + "<w:r><w:rPr><w:rFonts w:ascii=\"Yu Gothic\" w:hAnsi=\"Yu Gothic\" w:eastAsia=\"Yu Gothic\"/>" + (bold ? "<w:b/>" : "") + '<w:sz w:val="' + sz + '"/></w:rPr><w:t xml:space="preserve">' + x((b.s === "li" ? "・" : "") + b.t) + "</w:t></w:r></w:p>"; };
  const zip = new window.JSZip(), H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  zip.file("[Content_Types].xml", H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels", H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml", H + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + blocks(m).map(para).join("") + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418" w:header="851" w:footer="992" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return await zip.generateAsync({ type: "blob" });
}
async function download(kind){
  const m = cur(); if(!S.dl){ toast("この画面では保存できません。「テキストをコピー」をお使いください"); return; }
  const base = (m.title || "議事録").replace(/[\\/:*?"<>|]/g, "_").slice(0, 60);
  try {
    const data = kind === "docx" ? await toDocx(m) : toMd(m);
    await S.dl.save({ filename: base + "_議事録." + kind, data });
    toast("保存しました"); say(L("done"));
  } catch(e){ if(!e || e.code !== "declined") toast("保存できませんでした。コピーをお試しください"); }
}

/* ---------- events ---------- */
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function startMeeting(init){
  const m = newMeeting(init); S.mobileMeeting = true; S.ev = null; S.err = ""; render(); say("会議の名前と日付を入れて、文字起こしを貼ってね。資料も一緒にどうぞ！"); return m;
}
document.addEventListener("keydown", e => { if(e.key === "Escape"){ $("#modal").hidden = true; } if((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.act === "hint"){ e.preventDefault(); hintNow(true); } });
document.addEventListener("click", async e => {
  if(e.target.id === "modal"){ e.target.hidden = true; return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, m = cur();
  if(a === "new") return startMeeting();
  if(a === "sample"){ const c = JSON.parse(JSON.stringify(SAMPLE)); const mm = startMeeting(c); mm.materials = c.materials; S.tab = "intake"; persist(mm, true); render(); say("サンプル会議を用意したよ！「議事録づくりへ進む」から、さっそく作ってみよう。"); return toast("架空のサンプル会議を作りました"); }
  if(a === "open"){ S.cur = el.dataset.id; S.mobileMeeting = true; S.ev = null; S.err = ""; S.tab = cur().result ? "min" : "intake"; return render(); }
  if(a === "list"){ S.mobileMeeting = false; return render(); }
  if(a === "del"){ if(S.arm !== el.dataset.id){ S.arm = el.dataset.id; el.textContent = "本当に削除"; setTimeout(() => { S.arm = null; if(el.isConnected) el.textContent = "削除"; }, 3000); return; } S.arm = null; return removeMeeting(el.dataset.id); }
  if(a === "evx"){ S.ev = null; renderEv(); if(S.tab === "tr") renderBody(); return; }
  if(a === "about") return showAbout();
  if(a === "modalx"){ $("#modal").hidden = true; return; }
  if(a === "tipsw"){ H.on = !H.on; try { localStorage.setItem("endroll_tips", H.on ? "on" : "off"); } catch(_){} if(!H.on){ H.msg = ""; helperRender(); } renderSide(); return toast(H.on ? "ロロのひとこと をオンにしました" : "ロロのひとこと をオフにしました（ロロをタップすると、いつでもヒントを聞けます）"); }
  if(a === "hint") return hintNow(true);
  if(a === "tipx"){ H.msg = ""; helperRender(); return; }
  if(!m) return;
  if(a === "tab"){ S.tab = el.dataset.t; return renderMain(); }
  if(a === "ev"){ S.ev = Number(el.dataset.n); renderEv(); if(S.tab === "tr") renderBody(); return; }
  if(a === "saveTr"){ const v = $("#trta").value; m.transcript = v.slice(0, LIM.transcript); persist(m, true); rerender(); renderSide(); say("文字起こし、受け取ったよ！次は「議事録」タブで作ってみよう。"); return toast(v.length > LIM.transcript ? "上限を超えた分は切り捨てました" : "反映しました"); }
  if(a === "delmat"){ m.materials.splice(Number(el.dataset.i), 1); persist(m); return renderBody(); }
  if(a === "gen") return gen();
  if(a === "stop"){ if(S.ctl) S.ctl.abort(); return; }
  if(a === "ok"){ const x = m.result[el.dataset.k][Number(el.dataset.i)]; x.ok = !x.ok; persist(m); const rr = m.result; if([...rr.decisions, ...rr.pending, ...rr.actions].every(y => y.ok)) say("ぜんぶ確認済み！状態を「承認済み」にして、出力しよう。"); return rerender(); }
  if(a === "rm"){ m.result[el.dataset.k].splice(Number(el.dataset.i), 1); persist(m); return rerender(); }
  if(a === "add"){ const k = el.dataset.k; m.result[k].push(k === "actions" ? { task: "（内容を入力）", owner: "未定", due: "未定", refs: [], ok: false, done: false } : { text: "（内容を入力）", topic: "", refs: [], ok: false }); persist(m); return rerender(); }
  if(a === "done"){ m.result.actions[Number(el.dataset.i)].done = el.checked; persist(m); return rerender(); }
  if(a === "sug") return ask(el.dataset.q);
  if(a === "dl") return download(el.dataset.f);
  if(a === "copy"){ try { await navigator.clipboard.writeText(toText(m)); toast("コピーしました"); } catch(_){ toast("コピーできませんでした。プレビューを選んでコピーしてください"); } }
});
document.addEventListener("input", e => {
  const t = e.target, m = cur(); if(!m) return;
  if(t.dataset.f){ m[t.dataset.f] = t.value; persist(m); const h = $(".top h1"); if(t.dataset.f === "title" && h) h.textContent = t.value || "（無題の会議）"; clearTimeout(S.sideT); S.sideT = setTimeout(renderSide, 300); }
});
document.addEventListener("change", async e => {
  const t = e.target, m = cur(); if(!m) return;
  if(t.id === "stsel"){ m.status = t.value; persist(m); renderMain(); return renderSide(); }
  if(t.dataset.editIn){ setPath(m, t.dataset.editIn, t.value.trim() || "未定"); return persist(m); }
  if(t.id === "trfile" && t.files[0]){
    try { const tx = await readFile(t.files[0]); m.transcript = tx.slice(0, LIM.transcript); persist(m, true); toast(tx.length > LIM.transcript ? "長いため先頭 " + LIM.transcript.toLocaleString() + " 字を取り込みました" : "取り込みました"); renderMain(); renderSide(); }
    catch(_){ toast("このファイルは読み取れませんでした。本文を貼り付けてください"); }
    t.value = "";
  }
  if(t.id === "matfile"){
    for(const f of [...t.files]){
      if(m.materials.length >= LIM.materials){ toast("資料は " + LIM.materials + " ファイルまでです"); break; }
      try { const tx = (await readFile(f)).trim(); if(!tx){ toast(f.name + " から文字を読み取れませんでした"); continue; } m.materials.push({ name: f.name, text: tx.slice(0, LIM.material) }); toast(tx.length > LIM.material ? f.name + " は先頭 " + LIM.material.toLocaleString() + " 字を取り込みました" : f.name + " を取り込みました"); }
      catch(_){ toast(f.name + " は読み取れませんでした。本文をコピーして貼り付けてください"); }
    }
    persist(m, true); t.value = ""; renderBody();
  }
});
document.addEventListener("focusout", e => {
  const t = e.target, m = cur(); if(!m || !t.dataset || !t.dataset.edit) return;
  setPath(m, t.dataset.edit, t.innerText.replace(/\n+$/, "").trim()); persist(m);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"), m = cur(); if(!f || !m) return; e.preventDefault();
  if(f.dataset.form === "ask"){ const i = $("#q"), q = i.value; i.value = ""; return ask(q); }
  if(f.dataset.form === "rename"){
    const to = f.elements.to.value.trim(), from = f.dataset.from; if(!to) return;
    const re = new RegExp("^(\\s*[\\[(（]?\\d{1,2}:\\d{2}(?::\\d{2})?[\\])）]?\\s*)" + escRe(from) + "([:：])");
    m.transcript = m.transcript.split(/\r?\n/).map(l => l.replace(re, (_, a, b) => a + to + b)).join("\n"); persist(m, true); renderBody(); toast("置き換えました");
  }
});

/* ---------- start ---------- */
const useCap = n => window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
(async () => {
  render();
  const [user, db, sample, dl] = await Promise.all([useCap("user"), useCap("db"), useCap("sample"), useCap("downloads")]);
  S.sample = sample; S.dl = dl;
  if(user){ S.me = await user.me(); S.uid = S.me.id; }
  if(db && S.uid){
    S.col = db.collection("data/users/" + S.uid);
    S.col.onSnapshot(snap => {
      let changed = false;
      snap.docChanges().forEach(c => {
        const id = c.doc.id;
        if(c.type === "removed"){ if(S.meetings[id]){ delete S.meetings[id]; changed = true; if(S.cur === id) S.cur = null; } return; }
        const d = JSON.parse(JSON.stringify(c.doc.data() || {})); d.id = id;
        const mine = S.meetings[id];
        if(!mine || (d.updatedAt || 0) > (mine.updatedAt || 0)){ S.meetings[id] = d; changed = true; }
      });
      if(snap.metadata.fromCache && !changed) return;
      renderSide(); if(changed && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) rerender();
    }, () => { S.mem = true; render(); });
  } else S.mem = true;
  render();
  roroRender();
})();
</script>
